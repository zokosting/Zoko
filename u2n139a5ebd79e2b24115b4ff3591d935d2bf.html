<html><head><title>1 año cuando tienes 20 años representa la 0.05 parte de tu vida; pero con 45 años es la 0.02 parte</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc9f6a00c352ec42208a82cbe368cb5a6b&quot;},&quot;name&quot;:&quot;reflexiones&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:39:34+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:39:34+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;1 a&ntilde;o cuando tienes 20 a&ntilde;os representa la 0.05 parte de tu vida; pero con 45 a&ntilde;os es la 0.02 parte&quot;,&quot;created_date&quot;:&quot;2026-01-14T20:30:38+0100&quot;,&quot;modified_date&quot;:&quot;2026-01-14T20:33:11+0100&quot;}"><content><content><content><div class="align-left" style="text-align:left !important">Hay cierta sabidur&iacute;a en pensar que es normal que cuando eres viejo el tiempo pasa sin darte ni cuenta. Porque cuando tienes 20 a&ntilde;os, 1 a&ntilde;o representa la 0.05 parte, el 5% de tu vida; pero 1 a&ntilde;o con 45 a&ntilde;os es la 0.02 parte, el 2%.<br></div></content></content></content></body></html>
