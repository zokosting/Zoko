<html><head><title>We're all going to die. That alone should make us love each other but it doesn't. We are eaten up by trivialities and nothing</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc198d0c16e1cb4061acf8f23bfe9a53fd&quot;},&quot;name&quot;:&quot;PuraPoes&iacute;a&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:35:25+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:35:25+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;We're all going to die. That alone should make us love each other but it doesn't. We are eaten up by trivialities and nothing&quot;,&quot;created_date&quot;:&quot;2024-11-25T14:22:57+0100&quot;,&quot;modified_date&quot;:&quot;2024-11-25T18:06:15+0100&quot;}"><content><content><div><div><span>&ldquo;We're all going to die, all of us, what a circus! That alone should make us love each other but it doesn't. We are terrorized and flattened by trivialities, we are eaten up by nothing.&rdquo;&mdash; Charles Bukowski</span><br></div><div><br></div></div></content></content></body></html>
