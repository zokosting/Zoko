<html><head><title>Arriba y Abajo en el espacio</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc9f6a00c352ec42208a82cbe368cb5a6b&quot;},&quot;name&quot;:&quot;reflexiones&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:39:34+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:39:34+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;Arriba y Abajo en el espacio&quot;,&quot;created_date&quot;:&quot;2026-04-04T14:35:35+0200&quot;,&quot;modified_date&quot;:&quot;2026-04-04T14:37:01+0200&quot;}"><content><content><content><div><div><span>Arriba es en direcci&oacute;n contraria al centro del objeto en el que nos encontramos, o sea, al centro de gravedad.</span><br></div><div><span>Abajo, pues al rev&eacute;s. En direcci&oacute;n a dicho centro de gravedad.</span><br></div><div class="align-left" style="text-align:left !important">F&iacute;sica. As&iacute; en el espacio.<br></div><div class="align-left" style="text-align:left !important">Como en la vida, el centro de gravedad es pues la pobreza.<br></div></div></content></content></content></body></html>
