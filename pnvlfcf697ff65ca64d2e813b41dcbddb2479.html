<html><head><title>El objetivo de un castigo debería ser evitar la reincidencia en el futuro, no hacer pagar por lo cometido en el pasado</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc9f6a00c352ec42208a82cbe368cb5a6b&quot;},&quot;name&quot;:&quot;reflexiones&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:39:34+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:39:34+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;El objetivo de un castigo deber&iacute;a ser evitar la reincidencia en el futuro, no hacer pagar por lo cometido en el pasado&quot;,&quot;created_date&quot;:&quot;2024-09-12T10:28:03+0200&quot;,&quot;modified_date&quot;:&quot;2024-09-12T11:02:53+0200&quot;}"><content><div>El objetivo del castigo es evitar la reincidencia en el futuro, no hacerle pagar por lo cometido en el pasado. Si hubiera que castigar a todos los que albergan aunque solo sea un poco de maldad en el coraz&oacute;n, nadie saldr&iacute;a impune.</div><div><i>[O a todo aquel que haga algo mal. Eso es punitivismo.]</i></div><div>-S&eacute;neca</div></content></body></html>
