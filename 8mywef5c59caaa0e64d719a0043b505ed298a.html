<html><head><title>Are you too busy to improve?</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuce850bd0c057845e7823664ac7d742a2a&quot;},&quot;name&quot;:&quot;Liderazgo&quot;,&quot;created_date&quot;:&quot;2014-10-13T17:12:09+0200&quot;,&quot;modified_date&quot;:&quot;2014-10-13T17:12:09+0200&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;Are you too busy to improve?&quot;,&quot;created_date&quot;:&quot;2025-05-05T19:49:48+0200&quot;,&quot;modified_date&quot;:&quot;2025-05-05T19:52:46+0200&quot;}"><content><content><div><div class="align-left" style="text-align:left !important">How to work better:<br></div><ol><li class="align-left" style="text-align:left !important">Do <b>one thing</b> at a time.<br></li><li class="align-left" style="text-align:left !important">Know the <b>problem</b>.<br></li><li class="align-left" style="text-align:left !important">Learn to <b>listen</b>.<br></li><li class="align-left" style="text-align:left !important">Learn to <b>ask </b>questions.<br></li><li class="align-left" style="text-align:left !important"><b>Distinguish </b>sense from nonsense.<br></li><li class="align-left" style="text-align:left !important"><b>Accept </b>change as inevitable.<br></li><li class="align-left" style="text-align:left !important"><b>Admit </b>mistakes.<br></li><li class="align-left" style="text-align:left !important">Say it <b>simple</b>.<br></li><li class="align-left" style="text-align:left !important">Be <b>calm</b>.<br></li><li class="align-left" style="text-align:left !important"><b>Smile</b>, and try ur best.</li></ol><div class="align-left" style="text-align:left !important"><img src="8mywe0c67ca2517d64af092453c6015bc2262.jpeg">&nbsp;<br></div><div><br></div></div></content></content></body></html>
