<html><head><title>El número 4 del reloj de la Puerta Del Sol</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc9f6a00c352ec42208a82cbe368cb5a6b&quot;},&quot;name&quot;:&quot;Conocimiento&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:41:21+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:41:21+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#ffffff&quot;,&quot;name&quot;:&quot;El n&uacute;mero 4 del reloj de la Puerta Del Sol&quot;,&quot;created_date&quot;:&quot;2025-01-27T22:39:10+0100&quot;,&quot;modified_date&quot;:&quot;2025-01-27T22:43:56+0100&quot;}"><content><div><div>El n&uacute;mero 4 son IIII y no IV por 2 teor&iacute;as:</div><div>la primera es que los romanos no sol&iacute;an escribir IV solo porque era una abreviatura de J, su dios mayor.</div><div>&nbsp;la segunda teor&iacute;a es porque la sombra de la V en los relojes solares solapaba la I (IV).&nbsp;</div></div></content></body></html>
