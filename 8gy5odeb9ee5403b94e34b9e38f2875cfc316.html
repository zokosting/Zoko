<html><head><title>El Dilema Del Prisionero</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc9f6a00c352ec42208a82cbe368cb5a6b&quot;},&quot;name&quot;:&quot;Conocimiento&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:41:21+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:41:21+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;El Dilema Del Prisionero&quot;,&quot;created_date&quot;:&quot;2026-05-03T13:33:56+0200&quot;,&quot;modified_date&quot;:&quot;2026-05-03T13:38:11+0200&quot;}"><content><div>Dos personas encarceladas e incomunicadas, es decir sin saber lo que la otra persona dice:</div><div>- Quien es declarado culpable es encarcelado, con una pena dura.</div><div>- Si ninguno delata al otro, ambos salen.</div><div>- Si ambos declaran culpable al otro, ambos quedan encarcelados, con una condena menor.</div><div><br></div></content></body></html>
