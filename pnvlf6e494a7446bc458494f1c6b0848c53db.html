<html><head><title>Más infranqueable es la puerta de una mazmorra</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc72cdc3bbc503462083557045b9b7d7ef&quot;},&quot;name&quot;:&quot;filosof&iacute;a para seguir adelante&quot;,&quot;created_date&quot;:&quot;2013-07-20T16:25:47+0200&quot;,&quot;modified_date&quot;:&quot;2024-01-23T23:01:44+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;M&aacute;s infranqueable es la puerta de una mazmorra&quot;,&quot;created_date&quot;:&quot;2024-09-16T20:19:38+0200&quot;,&quot;modified_date&quot;:&quot;2024-09-16T20:20:21+0200&quot;}"><content><content><div><div><span>Ese pobre hombre se cree alguien porque ante la puerta que guarda hay una larga cola de clientes.</span><br></div><div><span>Y dentro, su jefe goza al pensar que su infranqueable puerta es se&ntilde;al de que es un hombre influyente y poderoso,  sin darse cuenta de que m&aacute;s infranqueable es la puerta de una mazmorra.</span><br></div></div></content></content></body></html>
