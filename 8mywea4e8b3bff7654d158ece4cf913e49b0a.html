<html><head><title>La libertad completa solo existirá cuando sea indiferente vivir o morir</title></head><body data-notebook="{&quot;cover&quot;:{&quot;is_private&quot;:true,&quot;cover_id&quot;:&quot;5gyuc198d0c16e1cb4061acf8f23bfe9a53fd&quot;},&quot;name&quot;:&quot;PuraPoes&iacute;a&quot;,&quot;created_date&quot;:&quot;2013-02-22T21:35:25+0100&quot;,&quot;modified_date&quot;:&quot;2013-02-22T21:35:25+0100&quot;}" data-notecard="{&quot;color&quot;:&quot;#FFFFFF&quot;,&quot;name&quot;:&quot;La libertad completa solo existir&aacute; cuando sea indiferente vivir o morir&quot;,&quot;created_date&quot;:&quot;2025-04-23T16:33:02+0200&quot;,&quot;modified_date&quot;:&quot;2025-04-23T16:38:52+0200&quot;}"><content><div>La libertad completa solo existir&aacute; cuando sea indiferente vivir o morir.</div><div>-Dostoievsky</div><div><br></div><div><i>Realmente tienes miedo a no vivir, a no estar viviendo suficiente, a ver si en alg&uacute;n momento nos sentimos vivos, a&uacute;n no has llegado "a lo profundo".</i></div></content></body></html>
